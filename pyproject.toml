[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dataguard"
version = "0.1.0"
description = "Local synthetic RAG security evaluation prototype"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "fastapi==0.135.3",
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "pydantic==2.13.4",
  "psycopg[binary]==3.3.4",
  "PyYAML==6.0.3",
  "SQLAlchemy==2.0.51",
  "uvicorn==0.51.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
]

[project.scripts]
dataguard-validate = "dataguard.validation.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dataguard.resources" = ["*.yaml"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
