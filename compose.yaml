services:
  postgres:
    image: postgres:17.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATAGUARD_POSTGRES_DB:?set DATAGUARD_POSTGRES_DB}
      POSTGRES_USER: ${DATAGUARD_POSTGRES_USER:?set DATAGUARD_POSTGRES_USER}
      POSTGRES_PASSWORD: ${DATAGUARD_POSTGRES_PASSWORD:?set DATAGUARD_POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - dataguard-postgres:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - ./artifacts:/app/artifacts:ro
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${DATAGUARD_API_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATAGUARD_PROJECT_ROOT: /app
      DATAGUARD_PROFILE: ${DATAGUARD_PROFILE:-evidence}
      DATAGUARD_STORAGE_BACKEND: postgresql
      DATAGUARD_DATABASE_DSN: postgresql+psycopg://${DATAGUARD_POSTGRES_USER:?set DATAGUARD_POSTGRES_USER}:${DATAGUARD_POSTGRES_PASSWORD:?set DATAGUARD_POSTGRES_PASSWORD}@postgres:5432/${DATAGUARD_POSTGRES_DB:?set DATAGUARD_POSTGRES_DB}
      DATAGUARD_ALLOW_CONTAINER_HOST_GATEWAY: "true"
      DATAGUARD_OLLAMA_BASE_URL: http://host.docker.internal:11434
      DATAGUARD_RUNTIME_STATE_DIR: artifacts/runtime
      DATAGUARD_EXPERIMENT_MANIFEST_PATH: artifacts/runtime/experiment-manifest.v1.json
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  dataguard-postgres:
